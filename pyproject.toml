[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jgarmintracker"
dynamic = ["version"]
description = "Suivi local des activités et de la santé Garmin : synchronisation, sports, tableaux et graphiques."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "flask>=3.0",
    "garminconnect==0.3.17",
    "pillow>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jgarmin = "jgarmintracker.cli:app"

[tool.setuptools.dynamic]
version = { attr = "jgarmintracker.__version__" }

[tool.setuptools.packages.find]
include = ["jgarmintracker*"]

[tool.setuptools.package-data]
"jgarmintracker.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
